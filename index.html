<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #0d233a 0%, #040a14 80%);
            color: #73c2fb;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Bagian Header */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #a2d8ff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(115, 194, 251, 0.5);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 10px;
            color: #457b9d;
            letter-spacing: 2px;
        }

        /* Bagian Video */
        .media-box {
            width: 100%;
            aspect-ratio: 16/9;
            border: 1px solid #1d4e79;
            border-radius: 8px;
            padding: 5px;
            background: rgba(4, 10, 20, 0.6);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 15px rgba(29, 78, 121, 0.3);
            position: relative;
            overflow: hidden; /* Tambahan agar video tidak keluar dari border melengkung */
        }

        .media-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        /* Bagian Form */
        .form-box {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 11px;
            color: #457b9d;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            background: rgba(13, 35, 58, 0.4);
            border: 1px solid #16325c;
            border-radius: 6px;
            padding: 14px 16px;
            color: #73c2fb;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
            appearance: none; 
            -webkit-appearance: none;
        }

        .input-group input::placeholder {
            color: #2a4b6e;
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: #2a75bb;
            box-shadow: 0 0 10px rgba(42, 117, 187, 0.3);
            background: rgba(13, 35, 58, 0.8);
        }

        /* Custom Dropdown Arrow untuk Select */
        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▼';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #2a75bb;
            font-size: 10px;
            pointer-events: none;
        }

        /* Tombol Send Attack */
        .btn-submit {
            margin-top: 15px;
            background: transparent;
            border: 1px solid #2a75bb;
            border-radius: 6px;
            padding: 16px;
            color: #a2d8ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(42, 117, 187, 0.1);
        }

        .btn-submit:active {
            background: rgba(42, 117, 187, 0.2);
            box-shadow: 0 0 20px rgba(42, 117, 187, 0.4);
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Phantom Universe</h1>
            <p>PHANTOM UNIVERSE MOD</p>
        </div>

        <!-- Video Box -->
        <div class="media-box">
            <!-- SUDAH DIPASANG LINK VIDEO DARI ANDA -->
            <video autoplay loop muted playsinline>
                <source src="https://ganga--link--ghhzdp9sv8hk.code.run/i/aiutt44jc5.mp4" type="video/mp4">
                Browser Anda tidak mendukung tag video.
            </video>
        </div>

        <!-- Form Box -->
        <div class="form-box">
            
            <!-- Input Nomor Target -->
            <div class="input-group">
                <label>NOMOR TARGET</label>
                <input type="tel" placeholder="masukkan nomor target">
            </div>

            <!-- Select Type Bug -->
            <div class="input-group">
                <label>SELECT TYPE BUG</label>
                <div class="select-wrapper">
                    <select>
                        <option value="CRASHED">CRASHED</option>
                        <option value="BLANK">BLANK</option>
                        <option value="DELAY_ATTACK">DELAY ATTACK</option>
                        <option value="KILL_ANDROO">KILL ANDROO</option>
                    </select>
                </div>
            </div>

            <!-- Tombol Send Attack -->
            <button class="btn-submit" onclick="kirimSerangan()">Send Attack</button>
        </div>
    </div>

    <script>
        function kirimSerangan() {
            let nomor = document.querySelector('input[type="tel"]').value;
            let tipeBug = document.querySelector('select').value;
            
            if(nomor === "") {
                alert("Masukkan nomor target terlebih dahulu breee!");
                return;
            }

            // Contoh aksi (bisa diganti dengan fetch/AJAX ke API Anda)
            alert("Memulai serangan " + tipeBug.toUpperCase() + " ke nomor " + nomor + "...");
        }
    </script>
</body>
</html>
